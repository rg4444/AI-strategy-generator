id: KR
name:
  lv: Dienvidkoreja
  en: South Korea
documents: AI Basic Act (2024/26) · sovereign AI programme · AI for All (MSIT, 2026-08)
text:
  interest:
    status: 'yes'
    text:
      lv: 'Suverenitāte: spēja kontrolēt visu MI vērtību ķēdi — no pusvadītājiem līdz izvietošanai.'
      en: 'Sovereignty: capability across the entire AI value chain, from semiconductors to deployment.'
  vision:
    quote: One of the world's top three AI powerhouses.
  objectives:
  - lv: 100 triljoni KRW (≈74 miljardi USD) MI fondam
    en: KRW 100 trillion (≈US$74 billion) AI fund
    numbered: true
  - lv: 4 triljoni KRW nacionālajam MI skaitļošanas centram līdz 2030
    en: KRW 4 trillion for a National AI Computing Centre through 2030
    numbered: true
  - lv: No 6.–7. vietas uz 3. Stanford globālajā indeksā
    en: From 6th–7th to 3rd on the Stanford global index
    numbered: true
  - lv: Bezmaksas, neierobežota vispārējas nozīmes MI piekļuve visiem 52 miljoniem iedzīvotāju; vismaz puse katras sistēmas uz vietējiem modeļiem (AI for All, 2026)
    en: Free, unlimited general-purpose AI for all 52 million citizens; at least half of every system on domestic models (AI for All, 2026)
    numbered: true
  position:
    lv: Pilna kaudze. Pieci vietējie pamatmodeļu konsorciji. MI kā sabiedriskais pakalpojums, sasaistīts ar valsts sistēmām (ārstu pieraksts, nodokļi, mājokļi).
    en: Full-stack build. Five domestic foundation-model consortia. AI as a public service, wired into government systems (doctor bookings, tax, housing).
